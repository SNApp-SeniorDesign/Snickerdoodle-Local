# Lives in: /etc/wpa_supplicant.conf

ctrl_interface=/run/wpa_supplicant
ctrl_interface_group=0
update_config=1
p2p_disabled=1


#Normal Netwrok
network={
    ssid=445269636f2773206950686f6e65
    psk=""
    key_mgmt=WPA-PSK
}

# SDSU eduroam
network={
    ssid="eduroam"
    key_mgmt=WPA-EAP
    eap=PEAP
    identity="<your_username>@<your_institution>.edu"
    password="<your_password>"
    phase2="auth=MSCHAPV2"   
}


