# /etc/wpa_supplicant.conf
ctrl_interface=/run/wpa_supplicant
ctrl_interface_group=0
update_config=1



network={
    ssid="eduroam"
    key_mgmt=WPA-EAP
    eap=PEAP
    identity="<your_username>@<your_institution>.edu"
    password="<your_password>"
    phase1="peaplabel=0"
    phase2="auth=MSCHAPV2"
}
